<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>CSS Icons</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .gg-airplane {
      box-sizing: border-box;
      position: relative;
      display: block;
      width: 18px;
      height: 18px;
      transform: scale(var(--ggs, 1));
      background:
        linear-gradient(to left, currentColor 22px, transparent 0) no-repeat
          center/16px 2px,
        radial-gradient(circle, currentColor 60%, transparent 40%) no-repeat right
          center/2px 2px;
    }
    .gg-airplane::after,
    .gg-airplane::before {
      content: "";
      display: block;
      position: absolute;
      box-sizing: border-box;
      width: 10px;
      height: 8px;
      border-right: 4px solid;
    }
    .gg-airplane::before {
      border-top-right-radius: 2px;
      top: 0;
      transform: perspective(10px) rotateX(10deg) skewX(30deg);
      box-shadow: -4px 3px 0 -2px;
    }
    .gg-airplane::after {
      border-bottom-right-radius: 2px;
      bottom: 0;
      transform: perspective(10px) rotateX(-10deg) skewX(-30deg);
      box-shadow: -4px -3px 0 -2px;
    }

    .gg-attribution {
      display: block;
      box-sizing: border-box;
      transform: scale(var(--ggs, 1));
      width: 16px;
      height: 18px;
      background:
        linear-gradient(to left, currentColor 14px, transparent 0) no-repeat 1px 2px/8px
          2px,
        linear-gradient(to left, currentColor 14px, transparent 0) no-repeat 6px
          14px/6px 2px,
        radial-gradient(circle, currentColor 60%, transparent 40%) no-repeat 10px
          12px/6px 6px,
        radial-gradient(circle, currentColor 60%, transparent 40%) no-repeat 0 0/6px
          6px;
    }
    .gg-attribution::after,
    .gg-attribution::before {
      content: "";
      display: block;
      box-sizing: border-box;
      position: absolute;
      width: 8px;
      height: 8px;
      border: 2px solid;
    }
    .gg-attribution::before {
      border-right: 0;
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      top: 8px;
      left: 2px;
    }
    .gg-attribution::after {
      border-left: 0;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      right: 2px;
      top: 2px;
    }

    .gg-eye-alt {
      position: relative;
      display: block;
      transform: scale(var(--ggs, 1));
      width: 24px;
      height: 18px;
      border-bottom-right-radius: 100px;
      border-bottom-left-radius: 100px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .gg-eye-alt::after,
    .gg-eye-alt::before {
      content: "";
      display: block;
      border-radius: 100px;
      position: absolute;
      box-sizing: border-box;
    }
    .gg-eye-alt::after {
      top: 2px;
      box-shadow:
        inset 0 -8px 0 2px,
        inset 0 0 0 2px;
      width: 24px;
      height: 24px;
    }
    .gg-eye-alt::before {
      width: 8px;
      height: 8px;
      border: 2px solid transparent;
      box-shadow:
        inset 0 0 0 6px,
        0 0 0 4px,
        6px 0 0 0,
        -6px 0 0 0;
      bottom: 4px;
      left: 8px;
    }

    .gg-framer {
      box-sizing: border-box;
      position: relative;
      display: block;
      transform: scale(var(--ggs, 1));
      width: 12px;
      height: 20px;
      overflow: hidden;
    }
    .gg-framer::after,
    .gg-framer::before {
      content: "";
      display: block;
      box-sizing: border-box;
      position: absolute;
      background: currentColor;
    }
    .gg-framer::before {
      width: 20px;
      height: 6px;
      transform: skewX(45deg);
      top: 6px;
      left: -11px;
      box-shadow: 20px -6px 0;
    }
    .gg-framer::after {
      width: 6px;
      height: 8px;
      transform: skewY(45deg);
      bottom: 4px;
      border-top-left-radius: 4px;
      opacity: 0.5;
    }

    .gg-infinity {
      background:
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat -4px 4px/2px
          2px,
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat 4px 4px/2px
          2px;
      box-sizing: border-box;
      position: relative;
      display: block;
      transform: rotate(-45deg) scale(var(--ggs, 1));
      width: 10px;
      height: 18px;
      border: 4px solid transparent;
      box-shadow: inset 0 0 0 2px;
    }
    .gg-infinity::after,
    .gg-infinity::before {
      content: "";
      display: block;
      box-sizing: border-box;
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid;
      border-radius: 200px;
      transform: rotate(45deg);
    }
    .gg-infinity::after {
      border-right-color: transparent;
      left: -8px;
      top: -4px;
    }
    .gg-infinity::before {
      border-left-color: transparent;
      right: -8px;
      top: 4px;
    }

    .gg-slack {
      position: relative;
      box-sizing: border-box;
      transform: scale(var(--ggs, 1));
      display: block;
      width: 20px;
      height: 20px;
      background:
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat 7px 2px/2px
          2px,
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat 15px 7px/2px
          2px,
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat 2px 10px/2px
          2px,
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat 10px
          15px/2px 2px,
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat 10px 2px/4px
          5px,
        linear-gradient(to left, currentColor 5px, transparent 0) no-repeat 5px 12px/4px
          5px;
    }
    .gg-slack::after,
    .gg-slack::before {
      background: currentColor;
      content: "";
      position: absolute;
      box-sizing: border-box;
      display: block;
      height: 4px;
      border-radius: 22px;
    }
    .gg-slack::before {
      width: 9px;
      top: 5px;
      box-shadow: 10px 5px 0;
    }
    .gg-slack::after {
      width: 4px;
      left: 5px;
      box-shadow:
        -5px 10px 0,
        0 10px 0,
        0 15px 0,
        5px 15px 0,
        5px 5px 0,
        5px 0 0,
        10px 5px 0;
    }
    
    .gg-trees {
      box-sizing: border-box;
      position: relative;
      display: block;
      transform: scale(var(--ggs, 1));
      width: 16px;
      height: 20px;
      border-left: 4px solid transparent;
      border-right: 3px solid transparent;
      border-top: 10px solid transparent;
      box-shadow:
        inset 2px 0 0,
        inset -2px 0 0;
    }
    .gg-trees::after,
    .gg-trees::before {
      content: "";
      display: block;
      position: absolute;
      box-sizing: border-box;
      width: 10px;
      height: 16px;
      border: 2px solid;
      border-radius: 8px;
      left: -4px;
      top: -10px;
    }
    .gg-trees::after {
      width: 8px;
      height: 12px;
      top: -6px;
      left: 4px;
    }


    .bg-circle {
      width: 180px;
      height: 180px;
      border: 1px #eee solid;
      background: radial-gradient(circle, transparent 60%, black 60%, black 70%, transparent 70%) no-repeat 0px 0px/180px 180px;
    }
    .bg-disc {
      width: 180px;
      height: 180px;
      border: 1px #eee solid;
      background: radial-gradient(circle, black 70%, transparent 71%) no-repeat 0px 0px/180px 180px;
    }

    .curves {
      position: relative;
    }
    .curves::before,
    .curves::after {
      content: "";
      display: block;
      width: 12px;
      height: 12px;

      position: absolute;
      top: 0;
      left: 0;

      border: 2px black solid;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
    }
    .curves::after {
      transform: rotate(160deg);
    }

    .pies {
      position: relative;
    }
    .pies::before,
    .pies::after {
      content: "";
      display: block;
      width: 0px;
      height: 0px;

      position: absolute;
      top: 0;
      left: 0;

      border: 12px black solid;
      border-right-color: transparent;
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
    }
    .pies::after {
      transform: rotate(30deg);
    }

    .bg-square {
      width: 16px;
      height: 16px;
      box-shadow: inset 2px 2px, inset -4px -4px;
    }

    .moon {
      width: 16px;
      height: 16px;
      box-shadow: inset 4px 4px;
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <main>
    <ul class="icons_list">
      <!-- complex transforms -->
      <li><span class="gg-airplane"></span></li>
      <!-- linear and radial gradients and curves -->
      <li><span class="gg-attribution"></span></li>
      <!-- complex inner shadows -->
      <li><span class="gg-eye-alt"></span></li>
      <!-- overflow hidden and skew -->
      <li><span class="gg-framer"></span></li>
      <!-- multiple methods: linear gradient, inset shadow, transforms -->
      <li><span class="gg-infinity"></span></li>
      <!-- creative linear gradient -->
      <li><span class="gg-slack"></span></li>
      <!-- inset shadow -->
      <li><span class="gg-trees"></span></li>

      <li><span class="bg-circle"></span></li>
      <li><span class="bg-disc"></span></li>
      <li><span class="curves"></span></li>
      <li><span class="pies"></span></li>
      <li><span class="bg-square"></span></li>
      <li><span class="moon"></span></li>
    </ul>
  </main>
</body>
</html>
