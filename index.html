<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>CSS Icons</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="icons.css">
</head>

<body>
  <main>
    <ul class="icons_list">
      <!-- Basic shapes -->
      <li data-icon="stop"><span title="aspect-ratio"></span></li>
      <li data-icon="rec"><span title="border-radius"></span></li>
      <li data-icon="play"><span title="border-triangle"></span></li>
      <li data-icon="pause"><span title="borders"></span></li>

      <!-- More elements (pseudo-elements) -->
      <li data-icon="next"><span></span></li>
      <li data-icon="ff"><span></span></li>

      <!-- Even more elements (shadows, gradients) -->
      <li data-icon="dice"><span></span></li>
      <li data-icon="sort_asc"><span></span></li>
      <li data-icon="doc"><span></span></li>
  
      <!-- Cut-out shapes -->
      <li data-icon="sort_desc"><span title="overflow hidden"></span></li>
      <li data-icon="bookmark"><span title="clip-path with polygon"></span></li>
      <li data-icon="anchor"><span title="clip-path with path"></span></li>
      <li data-icon="tag"><span title="clip-path with path"></span></li>
    </ul>
  </main>
  
  <footer>
      <a href="https://css.gg/">css.gg</a> | 
      Icon images:
      <a href="https://static.vecteezy.com/system/resources/previews/071/050/051/non_2x/play-icon-set-media-player-controls-with-play-pause-stop-record-rewind-and-forward-illustration-universal-and-music-navigation-symbol-interface-playback-ui-sign-control-pictogram-vector.jpg">Controls</a>,
      <a href="https://img.icons8.com/win10/1200/generic-sorting-2.jpg">Sort</a>,
      <a href="https://www.shutterstock.com/image-vector/document-line-icons-set-clipboard-260nw-2664218831.jpg">File</a>,
      <a href="https://static.vecteezy.com/system/resources/previews/048/234/614/non_2x/bookmark-icon-vector.jpg">Bookmark</a>,
      <a href="https://images.icon-icons.com/2248/PNG/512/tag_icon_135119.png">Tag</a>
  </footer>
</body>
</html>
